name: ci

# Required checks are documented in docs/QUALITY.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: scripts/install.sh --frozen-lockfile
      - name: Shared checks
        run: scripts/check.sh
      - name: Validate PR markers
        if: github.event_name == 'pull_request'
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          fs.writeFileSync(process.env.PR_BODY_FILE, event.pull_request.body ?? '');
          JS
          bash scripts/workflow/check-pr-markers.sh --body "$PR_BODY_FILE" --base "$PR_BASE" --head "$PR_HEAD" --branch "$PR_BRANCH"
      - name: Build
        run: scripts/build.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: scripts/install.sh --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Functional browser tests
        run: scripts/e2e.sh --grep-invert @diagnostic
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
