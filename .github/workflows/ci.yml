name: ci

# Required checks are documented in docs/QUALITY.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: scripts/install.sh --frozen-lockfile

      - name: Format check
        run: scripts/fmt-check.sh

      - name: Lint
        run: scripts/lint.sh

      - name: Typecheck
        run: scripts/typecheck.sh

      - name: Test
        run: scripts/test.sh

      - name: Build
        run: scripts/build.sh
