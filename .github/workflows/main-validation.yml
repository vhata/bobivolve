name: main-validation

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/main-validation.yml
      - scripts/**
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - vitest.config.ts
      - playwright.config.ts

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: scripts/install.sh --frozen-lockfile
      - name: Shared checks
        run: scripts/check.sh
      - name: Production build
        run: scripts/build.sh
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Functional browser tests
        run: scripts/e2e.sh --grep-invert @diagnostic
      - name: Deterministic headless probes
        run: |
          evidence="test-results/determinism-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          for seed in 0 42 2026; do
            scripts/sim.sh --seed "$seed" --ticks 1000 --no-heartbeat > "$evidence/seed-$seed-first.ndjson"
            scripts/sim.sh --seed "$seed" --ticks 1000 --no-heartbeat > "$evidence/seed-$seed-second.ndjson"
            diff -u "$evidence/seed-$seed-first.ndjson" "$evidence/seed-$seed-second.ndjson" > "$evidence/seed-$seed.diff"
          done
      - name: Review drift
        if: always()
        run: |
          mkdir -p test-results
          bash scripts/workflow/review-due.sh --paths 'sim host transport protocol ui test e2e' | tee "test-results/review-due-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
